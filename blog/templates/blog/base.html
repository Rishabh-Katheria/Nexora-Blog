<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
body{
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
}
.navbar-dark-custom{
  background:#000;
  border-bottom:1px solid #1f1f1f;
}
.card-dark{
  background:#0b0b0b;
  border:1px solid #1f1f1f;
  border-radius:24px;
}
.muted{color:#a1a1aa;}
.sidebar{
  width:220px;
  min-height:100vh;
  border-right:1px solid #1f1f1f;
}
.side-link{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  color:#fff;
  text-decoration:none;
  border-radius:14px;
}
.side-link:hover{
  background:#151515;
}
</style>
</head>
<body>

<nav class="navbar navbar-dark-custom px-4 py-3 d-flex justify-content-between">

  <a href="/" class="text-decoration-none text-white d-flex align-items-center gap-3">
    <div class="bg-primary rounded-3 d-flex align-items-center justify-content-center"
         style="width:42px;height:42px;font-weight:800;">N</div>
    <div>
      <div class="fw-bold fs-4">Nexora</div>
      <small class="muted">AI & ML Blog</small>
    </div>
  </a>

  <div class="d-flex align-items-center gap-2">

    {% if request.user.is_authenticated %}

      <a href="{% url 'dashboard' %}" class="btn btn-outline-light rounded-3">Dashboard</a>

      <a href="{% url 'write_article' %}" class="btn btn-light rounded-3 fw-semibold">Write</a>

      <a href="{% url 'logout' %}" class="btn btn-outline-light rounded-3">Logout</a>

    {% else %}

      <a href="{% url 'login' %}" class="btn btn-outline-light rounded-3">Login</a>

      <a href="{% url 'register' %}" class="btn btn-light rounded-3 fw-semibold">Create account</a>

    {% endif %}

  </div>

</nav>

<div class="d-flex">

  <aside class="sidebar p-3 d-none d-lg-block">

    <a href="/" class="side-link">
      <i class="bi bi-house"></i> Home
    </a>

    <a href="/dashboard/" class="side-link">
      <i class="bi bi-grid"></i> Dashboard
    </a>

    <a href="/write/" class="side-link">
      <i class="bi bi-plus-square"></i> Write
    </a>

  </aside>

  <main class="flex-grow-1 p-4">
    {% block content %}{% endblock %}
  </main>

</div>

</body>
</html>
