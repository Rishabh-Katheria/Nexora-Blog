{% extends 'blog/base.html' %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">

    <div class="card-dark p-5" style="max-width:460px;width:100%;">

        <div class="text-center mb-4">

            <div class="bg-primary rounded-4 d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:64px;height:64px;font-size:28px;font-weight:800;">
                N
            </div>

            <h2 class="fw-bold mb-2">Welcome back</h2>

            <p class="muted mb-0">
                Sign in to continue to Nexora
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label fw-semibold">Username</label>

                <div class="input-group">

                    <span class="input-group-text bg-dark border-secondary text-white rounded-start-3">
                        <i class="bi bi-person"></i>
                    </span>

                    <input type="text"
                           name="username"
                           class="form-control bg-dark text-white border-secondary rounded-end-3 py-3"
                           placeholder="Enter your username"
                           required>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">Password</label>

                <div class="input-group">

                    <span class="input-group-text bg-dark border-secondary text-white rounded-start-3">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input type="password"
                           name="password"
                           class="form-control bg-dark text-white border-secondary rounded-end-3 py-3"
                           placeholder="Enter your password"
                           required>

                </div>

            </div>

            <button class="btn btn-light w-100 py-3 rounded-3 fw-semibold">

                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login

            </button>

        </form>

        <div class="text-center mt-4">

            <span class="muted">Don’t have an account?</span>

            <a href="{% url 'register' %}"
               class="text-decoration-none fw-semibold ms-1">

                Create account

            </a>

        </div>

    </div>

</div>

{% endblock %}
